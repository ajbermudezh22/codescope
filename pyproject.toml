[project]
name = "codescope"
version = "0.1.0"
description = "Chat with a Python codebase via SCIP-precise symbol graphs and agentic retrieval."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "kuzu>=0.7",
  "lancedb>=0.13",
  "fastembed>=0.4",
  "protobuf>=6.31",
  "pandas>=2",
  "litellm>=1.50",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "httpx>=0.27",
  "pyyaml>=6",
  "grpcio-tools>=1.50",  # regen scip_pb2.py only
]

[project.scripts]
codescope = "codescope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
